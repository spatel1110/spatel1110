<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Career shown as a machine learning model training timeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060a16"/><stop offset="1" stop-color="#0b1324"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,'Liberation Mono',monospace}.card{fill:#0d1629;stroke:#2b3953}.stage{font:11px Consolas,monospace}.title{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f1f5f9}.text{font:13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.flow{stroke:url(#line);stroke-width:3;stroke-dasharray:9 10;animation:f 2.3s linear infinite}@keyframes f{to{stroke-dashoffset:-38}}.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.45}}</style>
  </defs>
  <rect width="1200" height="390" rx="22" fill="url(#bg)" stroke="#1e293b"/>
  <text x="38" y="41" class="m" font-size="12" fill="#67e8f9">MODEL DEVELOPMENT HISTORY</text><text x="979" y="41" class="m" font-size="11" fill="#475569">CHECKPOINTS // 03</text>
  <line class="flow" x1="110" y1="113" x2="1090" y2="113"/><polygon points="1087,106 1101,113 1087,120" fill="#ec4899"/>
  <circle class="pulse" cx="205" cy="113" r="13" fill="#07111f" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/><circle class="pulse" cx="600" cy="113" r="13" fill="#07111f" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)"/><circle class="pulse" cx="995" cy="113" r="13" fill="#07111f" stroke="#ec4899" stroke-width="3" filter="url(#glow)"/>
  <text x="205" y="82" text-anchor="middle" class="m stage" fill="#67e8f9">2019 — 2023</text><text x="600" y="82" text-anchor="middle" class="m stage" fill="#c4b5fd">2023 — 2025</text><text x="995" y="82" text-anchor="middle" class="m stage" fill="#f9a8d4">2026</text>

  <g transform="translate(45 151)"><rect class="card" width="320" height="195" rx="16"/><text x="22" y="32" class="m stage" fill="#67e8f9">STAGE 01 // PRE-TRAINING</text><text x="22" y="69" class="title">B.E. Computer Science</text><text x="22" y="94" class="text">Government Engineering College Patan</text><path d="M22 117H298" stroke="#23304a"/><text x="22" y="143" class="m" font-size="11" fill="#64748b">FOUNDATION</text><text x="22" y="169" class="m" font-size="12" fill="#cbd5e1">algorithms · software · data</text></g>
  <g transform="translate(440 151)"><rect class="card" width="320" height="195" rx="16"/><text x="22" y="32" class="m stage" fill="#c4b5fd">STAGE 02 // FINE-TUNING</text><text x="22" y="69" class="title">Software Developer · Odoo</text><text x="22" y="94" class="text">Production Python → applied ML systems</text><path d="M22 117H298" stroke="#23304a"/><text x="22" y="143" class="m" font-size="11" fill="#64748b">LEARNED FEATURES</text><text x="22" y="169" class="m" font-size="12" fill="#cbd5e1">semantic search · RAG · HNSW</text></g>
  <g transform="translate(835 151)"><rect class="card" width="320" height="195" rx="16" stroke="#6d3c79"/><text x="22" y="32" class="m stage" fill="#f9a8d4">STAGE 03 // DEPLOYMENT</text><text x="22" y="69" class="title">ML Engineer · Amazo</text><text x="22" y="94" class="text">Production GenAI and Document AI</text><path d="M22 117H298" stroke="#23304a"/><text x="22" y="143" class="m" font-size="11" fill="#64748b">SERVING</text><text x="22" y="169" class="m" font-size="12" fill="#cbd5e1">LLM agents · evaluation · AWS</text></g>
  <text x="600" y="374" text-anchor="middle" class="m" font-size="10" fill="#475569">PRE-TRAIN → FINE-TUNE → DEPLOY → KEEP LEARNING</text>
</svg>
