<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="Terminal showcase for Semantic Code Search and LLM Text-to-SQL projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060a16"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <style>.m{font-family:Consolas,'Liberation Mono',monospace}.s{font-family:Inter,Segoe UI,Arial,sans-serif}.window{fill:url(#bg);stroke:#29364e}.muted{fill:#64748b}.key{fill:#94a3b8}.value{fill:#e2e8f0}.green{fill:#4ade80}.cursor{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}.bar{animation:grow 1.8s ease-out forwards;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}} </style>
  </defs>
  <rect x="0" y="0" width="1200" height="455" rx="22" fill="#050816" stroke="#1e293b"/>
  <text x="38" y="38" class="m" font-size="12" fill="#67e8f9">SELECTED BUILDS // TERMINAL</text>

  <g transform="translate(30 62)">
    <rect class="window" width="555" height="360" rx="16"/><rect width="555" height="45" rx="16" fill="#101827"/><rect y="30" width="555" height="15" fill="#101827"/>
    <circle cx="22" cy="22" r="5" fill="#f87171"/><circle cx="40" cy="22" r="5" fill="#fbbf24"/><circle cx="58" cy="22" r="5" fill="#4ade80"/><text x="278" y="27" text-anchor="middle" class="m" font-size="11" fill="#64748b">semantic-search — zsh</text>
    <text x="24" y="76" class="m" font-size="13" fill="#4ade80">shubham@ml</text><text x="116" y="76" class="m" font-size="13" fill="#94a3b8">:</text><text x="126" y="76" class="m" font-size="13" fill="#60a5fa">~/projects</text><text x="210" y="76" class="m" font-size="13" fill="#f8fafc">$ deploy semantic-search</text>
    <text x="24" y="111" class="m" font-size="12" fill="#64748b">┌──────────────── MODEL REPORT ────────────────┐</text>
    <text x="24" y="139" class="m" font-size="12" fill="#94a3b8">│ model</text><text x="178" y="139" class="m" font-size="12" fill="#e2e8f0">CodeBERT</text><text x="516" y="139" text-anchor="end" class="m green" font-size="12">READY │</text>
    <text x="24" y="165" class="m" font-size="12" fill="#94a3b8">│ vector_index</text><text x="178" y="165" class="m" font-size="12" fill="#e2e8f0">FAISS</text><text x="516" y="165" text-anchor="end" class="m green" font-size="12">READY │</text>
    <text x="24" y="191" class="m" font-size="12" fill="#94a3b8">│ indexed</text><text x="178" y="191" class="m" font-size="12" fill="#e2e8f0">200,000+ snippets</text><text x="516" y="191" text-anchor="end" class="m green" font-size="12">100% │</text>
    <text x="24" y="217" class="m" font-size="12" fill="#64748b">└──────────────────────────────────────────────┘</text>
    <text x="24" y="253" class="m" font-size="11" fill="#64748b">QUERY LATENCY</text><rect x="24" y="264" width="340" height="7" rx="4" fill="#1e293b"/><rect class="bar" x="24" y="264" width="102" height="7" rx="4" fill="url(#cyan)"/><text x="516" y="271" text-anchor="end" class="m" font-size="12" fill="#67e8f9">&lt; 50 ms</text>
    <text x="24" y="305" class="m" font-size="11" fill="#64748b">SEARCH QUALITY · MRR@10</text><rect x="24" y="316" width="340" height="7" rx="4" fill="#1e293b"/><rect class="bar" x="24" y="316" width="267" height="7" rx="4" fill="url(#cyan)"/><text x="516" y="323" text-anchor="end" class="m" font-size="12" fill="#67e8f9">+34% vs BM25</text>
    <text x="24" y="350" class="m green" font-size="12">✓ deployment healthy</text><rect class="cursor" x="190" y="339" width="7" height="14" fill="#4ade80"/>
  </g>

  <g transform="translate(615 62)">
    <rect class="window" width="555" height="360" rx="16"/><rect width="555" height="45" rx="16" fill="#101827"/><rect y="30" width="555" height="15" fill="#101827"/>
    <circle cx="22" cy="22" r="5" fill="#f87171"/><circle cx="40" cy="22" r="5" fill="#fbbf24"/><circle cx="58" cy="22" r="5" fill="#4ade80"/><text x="278" y="27" text-anchor="middle" class="m" font-size="11" fill="#64748b">text-to-sql — agent trace</text>
    <text x="24" y="76" class="m" font-size="13" fill="#4ade80">shubham@ml</text><text x="116" y="76" class="m" font-size="13" fill="#94a3b8">:</text><text x="126" y="76" class="m" font-size="13" fill="#60a5fa">~/agents</text><text x="196" y="76" class="m" font-size="13" fill="#f8fafc">$ run text-to-sql --safe</text>
    <text x="24" y="111" class="m" font-size="12" fill="#64748b">[01]</text><text x="66" y="111" class="m" font-size="12" fill="#e2e8f0">schema linking</text><text x="516" y="111" text-anchor="end" class="m green" font-size="12">PASS</text>
    <text x="24" y="139" class="m" font-size="12" fill="#64748b">[02]</text><text x="66" y="139" class="m" font-size="12" fill="#e2e8f0">SQL generation</text><text x="516" y="139" text-anchor="end" class="m green" font-size="12">PASS</text>
    <text x="24" y="167" class="m" font-size="12" fill="#64748b">[03]</text><text x="66" y="167" class="m" font-size="12" fill="#e2e8f0">query safety</text><text x="516" y="167" text-anchor="end" class="m green" font-size="12">PASS</text>
    <text x="24" y="195" class="m" font-size="12" fill="#64748b">[04]</text><text x="66" y="195" class="m" font-size="12" fill="#e2e8f0">execute + repair</text><text x="516" y="195" text-anchor="end" class="m" font-size="12" fill="#fbbf24">RETRY → PASS</text>
    <path d="M30 221H525" stroke="#1e293b"/>
    <text x="24" y="253" class="m" font-size="11" fill="#64748b">HALLUCINATED COLUMNS</text><rect x="24" y="264" width="340" height="7" rx="4" fill="#1e293b"/><rect class="bar" x="24" y="264" width="18" height="7" rx="4" fill="#22c55e"/><text x="516" y="271" text-anchor="end" class="m" font-size="12" fill="#86efac">&lt; 2%</text>
    <text x="24" y="305" class="m" font-size="11" fill="#64748b">FAILED QUERIES AUTO-REPAIRED</text><rect x="24" y="316" width="340" height="7" rx="4" fill="#1e293b"/><rect class="bar" x="24" y="316" width="272" height="7" rx="4" fill="url(#pink)"/><text x="516" y="323" text-anchor="end" class="m" font-size="12" fill="#f0abfc">~80%</text>
    <text x="24" y="350" class="m green" font-size="12">✓ guarded execution enabled</text><rect class="cursor" x="234" y="339" width="7" height="14" fill="#4ade80"/>
  </g>
</svg>
