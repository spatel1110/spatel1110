  <g transform="translate(62 245)"><rect class="row" width="1100" height="76" rx="15"/><circle class="dot d2" cx="28" cy="38" r="6" fill="#8b5cf6"/><text class="small" x="47" y="28">LAYER 03</text><text class="head" x="47" y="50">GENAI + AGENTS</text>
    <g transform="translate(190 19)"><rect class="chip" width="92" height="38" rx="9"/><text class="tool" x="46" y="24" text-anchor="middle">LangChain</text></g><g transform="translate(292 19)"><rect class="chip" width="92" height="38" rx="9"/><text class="tool" x="46" y="24" text-anchor="middle">LangGraph</text></g><g transform="translate(394 19)"><rect class="chip" width="92" height="38" rx="9"/><text class="tool" x="46" y="24" text-anchor="middle">LangSmith</text></g><g transform="translate(496 19)"><rect class="chip" width="58" height="38" rx="9"/><text class="tool" x="29" y="24" text-anchor="middle">RAG</text></g><g transform="translate(564 19)"><rect class="chip" width="142" height="38" rx="9"/><text class="tool" x="71" y="24" text-anchor="middle">Prompt Engineering</text></g><g transform="translate(716 19)"><rect class="chip" width="58" height="38" rx="9"/><text class="tool" x="29" y="24" text-anchor="middle">MCP</text></g><g transform="translate(784 19)"><rect class="chip" width="76" height="38" rx="9"/><text class="tool" x="38" y="24" text-anchor="middle">Ollama</text></g><g transform="translate(870 19)"><rect class="chip" width="88" height="38" rx="9"/><text class="tool" x="44" y="24" text-anchor="middle">DeepEval</text></g>
  </g>

  <!-- Data -->
  <g transform="translate(62 335)"><rect class="row" width="1100" height="76" rx="15"/><circle class="dot d3" cx="28" cy="38" r="6" fill="#c084fc"/><text class="small" x="47" y="28">LAYER 04</text><text class="head" x="47" y="50">DATA + RETRIEVAL</text>
    <g transform="translate(210 19)"><rect class="chip" width="112" height="38" rx="9"/><text class="tool" x="56" y="24" text-anchor="middle">PostgreSQL</text></g><g transform="translate(332 19)"><rect class="chip" width="82" height="38" rx="9"/><text class="tool" x="41" y="24" text-anchor="middle">MySQL</text></g><g transform="translate(424 19)"><rect class="chip" width="72" height="38" rx="9"/><text class="tool" x="36" y="24" text-anchor="middle">FAISS</text></g><g transform="translate(506 19)"><rect class="chip" width="82" height="38" rx="9"/><text class="tool" x="41" y="24" text-anchor="middle">Chroma</text></g><g transform="translate(598 19)"><rect class="chip" width="94" height="38" rx="9"/><text class="tool" x="47" y="24" text-anchor="middle">Pinecone</text></g><g transform="translate(702 19)"><rect class="chip" width="72" height="38" rx="9"/><text class="tool" x="36" y="24" text-anchor="middle">Redis</text></g>
  </g>

  <!-- MLOps -->
  <g transform="translate(62 425)"><rect class="row" width="1100" height="110" rx="15"/><circle class="dot d4" cx="28" cy="55" r="6" fill="#ec4899"/><text class="small" x="47" y="45">LAYER 05</text><text class="head" x="47" y="67">MLOPS + CLOUD</text>
    <g transform="translate(210 13)"><rect class="chip" width="74" height="38" rx="9"/><text class="tool" x="37" y="24" text-anchor="middle">MLflow</text></g><g transform="translate(294 13)"><rect class="chip" width="58" height="38" rx="9"/><text class="tool" x="29" y="24" text-anchor="middle">DVC</text></g><g transform="translate(362 13)"><rect class="chip" width="78" height="38" rx="9"/><text class="tool" x="39" y="24" text-anchor="middle">Docker</text></g><g transform="translate(450 13)"><rect class="chip" width="64" height="38" rx="9"/><text class="tool" x="32" y="24" text-anchor="middle">AWS</text></g><g transform="translate(524 13)"><rect class="chip" width="62" height="38" rx="9"/><text class="tool" x="31" y="24" text-anchor="middle">EC2</text></g><g transform="translate(596 13)"><rect class="chip" width="54" height="38" rx="9"/><text class="tool" x="27" y="24" text-anchor="middle">S3</text></g><g transform="translate(660 13)"><rect class="chip" width="78" height="38" rx="9"/><text class="tool" x="39" y="24" text-anchor="middle">Lambda</text></g>
    <g transform="translate(210 59)"><rect class="chip" width="120" height="38" rx="9"/><text class="tool" x="60" y="24" text-anchor="middle">GitHub Actions</text></g><g transform="translate(340 59)"><rect class="chip" width="68" height="38" rx="9"/><text class="tool" x="34" y="24" text-anchor="middle">CI / CD</text></g><g transform="translate(418 59)"><rect class="chip" width="98" height="38" rx="9"/><text class="tool" x="49" y="24" text-anchor="middle">DeepSpeed</text></g>
  </g>
  <text x="600" y="570" text-anchor="middle" class="m" font-size="10" fill="#475569">FROM DATA AND MODELS TO RELIABLE PRODUCTION SYSTEMS</text>
</svg>
