<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Layered AI and machine learning engineering technology stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060a16"/><stop offset="1" stop-color="#0a1324"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,'Liberation Mono',monospace}.row{fill:#0d1629;stroke:#27344d}.chip{fill:#111c31;stroke:#334155}.head{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#f1f5f9}.small{font:11px Consolas,monospace;fill:#64748b}.tool{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.dot{animation:p 2.5s ease-in-out infinite}.d1{animation-delay:-.5s}.d2{animation-delay:-1s}.d3{animation-delay:-1.5s}.d4{animation-delay:-2s}@keyframes p{50%{opacity:.35}}</style>
  </defs>
  <rect width="1200" height="590" rx="22" fill="url(#bg)" stroke="#1e293b"/>
  <text x="38" y="41" class="m" font-size="12" fill="#67e8f9">ENGINEERING STACK // BY SYSTEM LAYER</text><text x="1040" y="41" class="m" font-size="11" fill="#475569">TOOLS // 37</text>
  <rect x="39" y="69" width="4" height="477" rx="2" fill="url(#rail)"/>

  <!-- Languages -->
  <g transform="translate(62 65)"><rect class="row" width="1100" height="76" rx="15"/><circle class="dot" cx="28" cy="38" r="6" fill="#22d3ee"/><text class="small" x="47" y="28">LAYER 01</text><text class="head" x="47" y="50">LANGUAGES</text>
    <g transform="translate(220 19)"><rect class="chip" width="90" height="38" rx="9"/><text class="tool" x="45" y="24" text-anchor="middle">Python</text></g>
    <g transform="translate(322 19)"><rect class="chip" width="62" height="38" rx="9"/><text class="tool" x="31" y="24" text-anchor="middle">SQL</text></g>
    <g transform="translate(396 19)"><rect class="chip" width="112" height="38" rx="9"/><text class="tool" x="56" y="24" text-anchor="middle">PostgreSQL</text></g>
    <g transform="translate(520 19)"><rect class="chip" width="82" height="38" rx="9"/><text class="tool" x="41" y="24" text-anchor="middle">MySQL</text></g>
    <g transform="translate(614 19)"><rect class="chip" width="110" height="38" rx="9"/><text class="tool" x="55" y="24" text-anchor="middle">JavaScript</text></g>
  </g>

  <!-- ML/DL -->
  <g transform="translate(62 155)"><rect class="row" width="1100" height="76" rx="15"/><circle class="dot d1" cx="28" cy="38" r="6" fill="#38bdf8"/><text class="small" x="47" y="28">LAYER 02</text><text class="head" x="47" y="50">ML / DL</text>
    <g transform="translate(190 19)"><rect class="chip" width="88" height="38" rx="9"/><text class="tool" x="44" y="24" text-anchor="middle">PyTorch</text></g><g transform="translate(288 19)"><rect class="chip" width="105" height="38" rx="9"/><text class="tool" x="52" y="24" text-anchor="middle">TensorFlow</text></g><g transform="translate(403 19)"><rect class="chip" width="70" height="38" rx="9"/><text class="tool" x="35" y="24" text-anchor="middle">Keras</text></g><g transform="translate(483 19)"><rect class="chip" width="112" height="38" rx="9"/><text class="tool" x="56" y="24" text-anchor="middle">Scikit-Learn</text></g><g transform="translate(605 19)"><rect class="chip" width="112" height="38" rx="9"/><text class="tool" x="56" y="24" text-anchor="middle">Hugging Face</text></g><g transform="translate(727 19)"><rect class="chip" width="112" height="38" rx="9"/><text class="tool" x="56" y="24" text-anchor="middle">Transformers</text></g><g transform="translate(849 19)"><rect class="chip" width="112" height="38" rx="9"/><text class="tool" x="56" y="24" text-anchor="middle">LoRA / QLoRA</text></g>
  </g>

