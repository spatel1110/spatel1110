<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Production machine learning impact metrics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#0a1323"/></linearGradient>
    <linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.card{fill:url(#bg);stroke:#23304a}.n{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.l{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.tag{font:11px Consolas,monospace;fill:#67e8f9}.bar{animation:grow 2s ease-out forwards;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}} </style>
  </defs>
  <g transform="translate(0 4)">
    <rect class="card" x="0" y="0" width="282" height="164" rx="16"/><rect x="0" y="0" width="282" height="3" rx="2" fill="url(#a)"/><text class="tag" x="24" y="34">RETRIEVAL_LATENCY</text><text class="n" x="24" y="87">−60%</text><text class="l" x="24" y="116">HNSW semantic search</text><rect x="24" y="136" width="230" height="5" rx="3" fill="#1e293b"/><rect class="bar" x="24" y="136" width="178" height="5" rx="3" fill="#22d3ee"/>
    <rect class="card" x="306" y="0" width="282" height="164" rx="16"/><rect x="306" y="0" width="282" height="3" rx="2" fill="url(#a)"/><text class="tag" x="330" y="34">DAILY_INFERENCE</text><text class="n" x="330" y="87">1,000+</text><text class="l" x="330" y="116">support tickets processed</text><path d="M330 141l16-12 17 7 18-24 18 9 18-31 18 8 18-26 18 5" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="card" x="612" y="0" width="282" height="164" rx="16"/><rect x="612" y="0" width="282" height="3" rx="2" fill="url(#a)"/><text class="tag" x="636" y="34">SEARCH_QUALITY</text><text class="n" x="636" y="87">+34%</text><text class="l" x="636" y="116">MRR@10 over BM25</text><g fill="#334155"><rect x="636" y="136" width="20" height="7"/><rect x="662" y="128" width="20" height="15"/><rect x="688" y="117" width="20" height="26"/><rect x="714" y="105" width="20" height="38"/></g><rect x="740" y="91" width="20" height="52" fill="#ec4899"/>
    <rect class="card" x="918" y="0" width="282" height="164" rx="16"/><rect x="918" y="0" width="282" height="3" rx="2" fill="url(#a)"/><text class="tag" x="942" y="34">RELIABILITY</text><text class="n" x="942" y="87">85%+</text><text class="l" x="942" y="116">automated test coverage</text><circle cx="1150" cy="88" r="29" fill="none" stroke="#1e293b" stroke-width="7"/><circle cx="1150" cy="88" r="29" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-dasharray="155 182" transform="rotate(-90 1150 88)"/>
  </g>
</svg>
